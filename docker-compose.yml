services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: heyel_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - heyel_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d heyel_db"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  heyel_db:

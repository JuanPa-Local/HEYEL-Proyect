spring.application.name=backend

# ------------------------------------------------------------------------------
# CONFIGURACIÓN DE BASE DE DATOS POSTGRESQL (Puerto 5433)
# ------------------------------------------------------------------------------
# Cambia 'heyel_db', 'postgres' y 'postgres' por el nombre de tu BD, usuario y clave si son distintos.
spring.datasource.url=jdbc:postgresql://localhost:5433/heyel_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------------------
# CONFIGURACIÓN DE JPA / HIBERNATE
# ------------------------------------------------------------------------------
# ddl-auto=update crea/actualiza automáticamente las tablas (como 'pacientes') en PostgreSQL sin borrar datos.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

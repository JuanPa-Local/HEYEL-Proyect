# Despliegue en Render como Blueprint: crea la base PostgreSQL y el servicio web desde el Dockerfile.
# En Render: New > Blueprint > elegir este repositorio y la rama que se va a publicar.
databases:
  - name: heyel-db
    databaseName: heyel_db
    user: heyel
    plan: free
    postgresMajorVersion: "17"

services:
  - type: web
    name: heyel
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/auth/terms
    branch: main
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: heyel-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: heyel-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: heyel-db
          property: password
      - key: COOKIE_SECURE
        value: "true"
